<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b3440'/%3E%3Cpath d='M8 23V12l8-5 8 5v11' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M13.5 23v-6h5v6' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Observatorio de Sapiencia (OdeS)</title>
    <!-- Carpeta de los videos del robot ODES del bloque: en el aplicativo salen de este mismo sitio
         (public/principal/robot). En WordPress no hay meta y el bloque usa la carpeta que trae (EDITAR ROBOT). -->
    <meta name="observatorio-robot-base" content="/principal/robot/" />
    <!-- Rutas desde la raíz (/principal/...), no relativas: la página se abre en
         /principal, sin barra final, y "./" apuntaría a la raíz del sitio. -->
    <link rel="stylesheet" href="/principal/pagina.css" />
  </head>
  <body id="arriba">
    <!--
      Página /principal: el bloque de WordPress del Observatorio dentro de una
      página que hace las veces del tema (cabecera y pie del Observatorio,
      columna de 1070 px y botón "Volver arriba", como en sapiencia.gov.co).

      Aquí NO va contenido del Observatorio: todo cambio de /principal se hace
      en observatorio-bloque.html, que es lo que se pega en WordPress.
      Ver LEEME.md.
    -->
    <a class="pp-saltar" href="#contenido">Saltar al contenido</a>

    <header class="pp-cabecera">
      <div class="pp-cabecera__interior">
        <a class="pp-cabecera__logo" href="/">
          <img
            src="/principal/recursos/img/logo-observatorio-blanco.png"
            alt="Observatorio de Sapiencia: ir al inicio"
            width="1319"
            height="390"
          />
        </a>
      </div>
    </header>

    <main id="contenido" class="pp-principal" tabindex="-1">
      <div class="pp-columna">
<!-- BLOQUE: aquí va observatorio-bloque.html, tal cual -->
      </div>
    </main>

    <footer class="pp-pie">
      <a class="pp-pie__logo" href="https://www.sapiencia.gov.co/" target="_blank" rel="noopener noreferrer">
        <img
          src="/principal/recursos/img/logo-sapiencia-alcaldia-blanco.png"
          alt="Sapiencia, Agencia de Educación Postsecundaria de Medellín. Alcaldía de Medellín, Distrito de Ciencia, Tecnología e Innovación (se abre en una pestaña nueva)"
          width="720"
          height="255"
          loading="lazy"
          decoding="async"
        />
      </a>
    </footer>

    <a class="pp-arriba" href="#arriba" data-pp-arriba>
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 3 2 9l1.4 1.4L8 5.8l4.6 4.6L14 9z" /></svg>
      <span class="pp-oculto">Volver arriba</span>
    </a>
    <script>
      // "Volver arriba" aparece al bajar, como el del tema de WordPress. Script
      // en línea a propósito: el servidor calcula el hash de cada script en
      // línea de esta página para su CSP (ver apps/server/src/frontend).
      ;(function () {
        var boton = document.querySelector('[data-pp-arriba]')
        if (!boton) return
        function actualizar() {
          boton.classList.toggle('pp-arriba--visible', window.scrollY > 300)
        }
        window.addEventListener('scroll', actualizar, { passive: true })
        actualizar()
      })()
    </script>
  </body>
</html>

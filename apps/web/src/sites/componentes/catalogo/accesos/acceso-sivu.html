<!--
  ACCESO A SIVU (OdeS): un circulo fijo abajo a la izquierda, con el edificio de SIVU, que se abre en una barra azul
  con "Ir a SIVU". Arriba de la pagina es solo el circulo; al bajar se abre, al subir se vuelve a encoger. Tambien se
  abre al pasar el cursor o al llegar con el teclado. Todo es un solo enlace: un toque lleva a SIVU, abierto o
  cerrado.

  Que editar:
    - El enlace (href) y los textos de la barra: odes-ac__nombre y odes-ac__detalle. Lo que leen los lectores de
      pantalla va en odes-ac__oculto.
    - El color, los tamanos, la letra y la sombra, en las variables --odes-ac-* del comienzo del CSS.
    - La imagen del circulo va dentro del CSS (--odes-ac-foto, en formato data:): no hay que subir nada a Medios.
-->
<a id="odes-acceso-sivu" class="odes-ac odes-ac--uno odes-ac--foto odes-ac--grande" href="https://odes-web.sapiencia.gov.co/sivu" data-odes-accesos data-odes-ac-modo="bajar">
  <span class="odes-ac__boton" aria-hidden="true"><span class="odes-ac__circulo"></span></span>
  <span class="odes-ac__lista" aria-hidden="true">
    <span class="odes-ac__enlace">
      <span class="odes-ac__textos"><span class="odes-ac__nombre">Ir a SIVU</span><span class="odes-ac__detalle">Tableros del Observatorio</span></span>
      <svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </span>
  </span>
  <span class="odes-ac__oculto">Ir a SIVU: tableros del Observatorio de Sapiencia</span>
</a>
